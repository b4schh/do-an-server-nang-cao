events { }

http {
    upstream dotnet_api {
        server api:8080;   # 'api' là tên service trong docker-compose
    }

    upstream minio_backend {
        server minio:9000;  # MinIO service trong docker-compose
    }

    server {
        listen 80;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Tăng giới hạn upload file lên 20MB (phù hợp với ASP.NET Core FormOptions)
        client_max_body_size 20M;

        # ============================================
        # PROXY CHO MINIO STORAGE (ƯU TIÊN CAO)
        # ============================================
        # Serving static files từ MinIO
        location /media/ {
            proxy_pass         http://minio_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            
            # Disable buffering for better performance
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Cache settings for images
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400";
            
            # CORS headers cho images
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
        }

        # ============================================
        # PROXY CHO API BACKEND (MẶC ĐỊNH)
        # ============================================
        location / {
            proxy_pass         http://dotnet_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            
            # Timeout settings - cao để support SSE
            proxy_connect_timeout 60s;
            proxy_send_timeout 24h;
            proxy_read_timeout 24h;
            
            # Disable buffering for SSE (không ảnh hưởng API thường)
            proxy_buffering off;
        }
    }
}
