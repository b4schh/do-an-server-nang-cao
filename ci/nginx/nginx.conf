user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream dotnet_api {
        server api:8080;
    }

    upstream minio_backend {
        server minio:9000;
    }

    server {
        listen 80;

        access_log /var/log/nginx/access.log;

        # Tăng giới hạn upload file lên 20MB
        client_max_body_size 20M;

        # ============================================
        # PROXY CHO MINIO STORAGE (ƯU TIÊN CAO)
        # ============================================
        location /media/ {
            proxy_pass         http://minio_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            
            # Disable buffering for better performance
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Cache settings for images
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400";
            
            # CORS headers cho images
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
        }

        # ============================================
        # PROXY CHO API BACKEND (MẶC ĐỊNH)
        # ============================================
        location / {
            proxy_pass http://dotnet_api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "keep-alive";
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
