# Local MinIO for development (không dùng Docker Compose cho API)
# Chạy riêng: docker-compose -p minio-local -f docker-compose.local.yml up -d
# Dừng: docker-compose -p minio-local -f docker-compose.local.yml down

services:
  minio:
    image: minio/minio
    container_name: minio-local-dev
    ports:
      - "9200:9000"      # MinIO API
      - "9201:9001"      # MinIO Console
    environment:
      MINIO_ROOT_USER: admin_dev
      MINIO_ROOT_PASSWORD: admin123dev
    volumes:
      - minio_data_local:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data_local:
